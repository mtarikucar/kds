# ============================================================================
# hummytummy.com — PRODUCTION host nginx vhost (SOURCE OF TRUTH)
# ============================================================================
# ⚠️  RECONSTRUCTED to mirror the observed prod behaviour (SPA at root, /app/* →
#     301 root, /api → backend). Before relying on it, CAPTURE THE LIVE PROD
#     VHOST verbatim and reconcile:
#
#         ssh root@38.242.233.166 'nginx -T' | sed -n '/server_name hummytummy.com/,/^}/p'
#
#     then update this file to match exactly (extra headers, gzip, logging, etc.).
#     Do NOT apply this to prod blind — prod is already correct; this file exists
#     so prod stops being the only place the routing lives.
#
# Prod container ports (docker-compose.prod.yml):
#   frontend SPA → 127.0.0.1:8080      backend API → 127.0.0.1:3000
#   landing (decoupled → marketing.hummytummy.com) → 127.0.0.1:3100
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name hummytummy.com www.hummytummy.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://hummytummy.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hummytummy.com;

    ssl_certificate     /etc/letsencrypt/live/hummytummy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hummytummy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        # Menu import (/api/menu/import/parse-source) chunks a large
        # HTML/PDF source into up to 6 sequential Claude calls and claims
        # the credits for all of them up front — that can run well past
        # nginx's 60s default. When the proxy cuts the connection early the
        # backend keeps running and completes anyway, so nothing refunds:
        # the operator is charged with no draft to show for it. 180s covers
        # the worst case with headroom.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /app { return 301 /; }
    location /app/  { rewrite ^/app/(.*)$ /$1 permanent; }

    # /robots.txt must reach the app.
    #
    # Observed on prod 2026-08-25, after v3.14.0: https://hummytummy.com/robots.txt
    # answers 404 with an nginx/1.24.0 (Ubuntu) body — the HOST's nginx, not the
    # container's — while an unknown path like /zzz.txt reaches the app
    # normally and /sitemap.xml is served. So something in the live vhost
    # 404s this one path before it is proxied, and it is not in this file:
    # these configs are reconstructed (see the header) and the live one has
    # drifted.
    #
    # This rule states the intent explicitly so a reconciliation cannot lose it
    # again. robots.txt is where every crawler is told which sitemaps exist;
    # a 404 there means sitemap discovery depends entirely on manual Search
    # Console submission.
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
